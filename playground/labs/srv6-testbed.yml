# Lab descriptor for the ANI-Gamut SRv6 substrate (the live containerlab lab is deployed
# from the 26-agai-srv6 repo: `sudo make deploy`, name srv6-inest-demo-new). NetAiBench
# does NOT deploy this lab; it only reads node names/kinds/links here and acts on the
# already-running containers clab-srv6-inest-demo-new-<node> via docker exec.
name: srv6-inest-demo-new

topology:
  nodes:
    hs1:  {kind: linux, image: ubuntu-node:latest}
    hs2:  {kind: linux, image: ubuntu-node:latest}
